server:
  port: 8080

spring:
  application:
    name: building-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDRESS:10.11.110.166:3306}/${MYSQL_DATABASE:building_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:serv}
    password: ${MYSQL_PASSWORD:Mi78452300}
  mvc:
    view:
      suffix: .html
      prefix: /

mybatis:
  mapper-locations: classpath*:mapper/*Mapper.xml

# 腾讯云对象存储。bucket 填写 BucketName-APPID，例如 examplebucket-1250000000
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-shanghai}
  bucket: ${COS_BUCKET:7072-prod-8gmyadj42ce90ec4-1387541623}
  expire-seconds: ${COS_EXPIRE_SECONDS:86400}

# 日志配置
logging:
  level:
    root: INFO
    com.tencent.wxcloudrun: DEBUG
  file:
    path: logs
    name: logs/building-server.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 300MB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} [%file:%line] - %msg%n"
